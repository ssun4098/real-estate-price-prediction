# api 컨테이너 하나만 띄웁니다. MySQL은 전에 만든 컨테이너(land-mysql)를 그대로 씁니다.
# 이 파일은 MySQL을 새로 만들거나 재시작하지 않으므로, 그 안의 자료는 그대로 남습니다.
#
# 처음 한 번 (api와 land-mysql 컨테이너를 같은 네트워크에 묶기. MySQL 재시작 없음):
#   docker network create v6_mysql
#   docker network connect v6_mysql land-mysql
# 실행:
#   docker compose up -d --build      → http://127.0.0.1:4175/
# 서버에 올릴 때 (80·443 포트, 아래 proxy 까지 함께 켬. docs/04-run-and-operate.md '서버에 올리기' 참고):
#   docker compose --profile deploy up -d --build      → http://<서버IP>/  또는  https://<서버IP>/
name: v6

services:
  api:
    build: .
    restart: unless-stopped
    # API 키·DB 계정은 .env 에서만 받는다. 이미지 안에는 넣지 않는다.
    env_file: .env
    environment:
      # 같은 네트워크 안에서는 컨테이너 이름이 곧 주소다. 포트도 MySQL 컨테이너 내부 포트(3306).
      # (.env 의 MYSQL_HOST / MYSQL_PORT 는 Docker 없이 python -m server 로 켤 때만 쓰인다)
      MYSQL_HOST: ${MYSQL_CONTAINER:-land-mysql}
      MYSQL_PORT: "3306"
      MODEL_DIR: /app/data/models
    networks: [mysql, web]
    ports:
      # 내 PC에서만 접속 가능. 다른 기기에서 열려면 왼쪽을 바꾸고 .env 의 ALLOWED_HOSTS 에도 추가.
      - "127.0.0.1:${PUBLIC_PORT:-4175}:${PUBLIC_PORT:-4175}"
    volumes:
      - ./data/models:/app/data/models:ro   # 학습 모델 파일 (읽기 전용)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # 서버용: ./certs/ 에 인증서(fullchain.pem, privkey.pem)가 없으면 시험용(자체 서명) 인증서를 한 번 만들어 준다.
  # 이미 파일이 있으면 아무것도 하지 않으므로, 정식 인증서를 넣어 두면 그것을 그대로 쓴다.
  certgen:
    profiles: [deploy]
    image: alpine/openssl
    entrypoint: ["sh", "-c"]
    command:
      - '[ -f /certs/fullchain.pem ] || openssl req -x509 -nodes -newkey rsa:2048 -days 825 -keyout /certs/privkey.pem -out /certs/fullchain.pem -subj "/CN=v6"'
    volumes:
      - ./certs:/certs

  # 서버용: 80(HTTP)·443(HTTPS)을 받아서 api 로 넘겨 준다. 앱(4175)은 밖으로 열지 않고 이 문을 통해서만 접속된다.
  # --profile deploy 를 붙였을 때만 켜진다. 설정은 deploy/nginx.conf.template.
  proxy:
    profiles: [deploy]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      certgen:
        condition: service_completed_successfully
    environment:
      PUBLIC_PORT: ${PUBLIC_PORT:-4175}         # nginx 설정 안의 ${PUBLIC_PORT} 자리에 들어간다
      NGINX_ENVSUBST_FILTER: PUBLIC_PORT       # 이 값만 바꿔 넣고, nginx 자신의 $변수는 건드리지 않음
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/certs:ro
    networks: [web]
    security_opt: ["no-new-privileges:true"]

networks:
  web: {}   # api 와 proxy 만 쓰는 내부 통로 (compose 가 만들고 지움)
  mysql:
    # 이미 있는 네트워크를 빌려 쓴다 (compose가 만들거나 지우지 않음). 위 '처음 한 번' 명령으로 만든다.
    external: true
    name: ${MYSQL_NETWORK:-v6_mysql}
